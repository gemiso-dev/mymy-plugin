[project]
name = "mymy-mcp"
version = "0.1.0"
description = "stdio MCP server bridging Claude Code/Desktop to MYMY (browser-handoff auth, transparent /api/mcp proxy)."
requires-python = ">=3.13"
dependencies = [
    "fastmcp>=2.3.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.scripts]
mymy-mcp = "mymy_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mymy_mcp"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
